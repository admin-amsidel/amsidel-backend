spring.application.name=amsidel-backend
server.port=${PORT:8080}

# --- PostgreSQL (Supabase) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://db.vbkcydezouaqgekdqgrp.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Amsidel#123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the pool small: Supabase free tier limits concurrent connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- CORS: production, test (Cloudflare Workers) and Angular dev server ---
app.cors.allowed-origins=${CORS_ORIGINS:https://www.amsidel.com,https://amsidel.com,https://amsidel-web.info-amsidel.workers.dev,http://localhost:4200}
