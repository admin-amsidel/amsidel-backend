spring.application.name=amsidel-backend
# Local secrets kept out of git (e.g. the mail key): secrets.properties next to pom.xml, if present
spring.config.import=optional:file:./secrets.properties
server.port=${PORT:8080}

# --- PostgreSQL (Supabase) ---
# Session pooler (IPv4). The direct host db.vbkcydezouaqgekdqgrp.supabase.co is IPv6-only,
# which Render and many networks cannot reach.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.vbkcydezouaqgekdqgrp}
# The password is not kept here: locally it comes from secrets.properties, on Render from DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the pool small: Supabase free tier limits concurrent connections
spring.datasource.hikari.maximum-pool-size=5
# Keep all 5 open and warm: the database is ~200-300 ms away (Tokyo), and opening a new SSL connection costs
# about a second, which a page making several calls at once would otherwise pay on every visit
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
# Recycle each connection after 1 hour (only when idle, never mid-query)
spring.datasource.hikari.max-lifetime=3600000
# Ping idle connections every 5 minutes so the network/pooler doesn't drop them silently
spring.datasource.hikari.keepalive-time=300000
# Wait at most 5 s for a row another transaction has locked (e.g. an uncommitted change in an SQL tool), then
# fail with "database is busy" instead of hanging until the server's statement timeout
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# --- JPA / Hibernate ---create /update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Scheduler: read-only product count check (ISO-8601 durations) ---
app.scheduler.product-count.initial-delay=${PRODUCT_COUNT_INITIAL_DELAY:PT1M}
app.scheduler.product-count.interval=${PRODUCT_COUNT_INTERVAL:PT15M}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Mail is optional (and has its own "not set up" message in the portal): its state must not mark the app DOWN
management.health.mail.enabled=false

# --- CORS: production, test (Cloudflare Workers) and Angular dev server ---
app.cors.allowed-origins=${CORS_ORIGINS:https://www.amsidel.com,https://amsidel.com,https://amsidel-web.info-amsidel.workers.dev,http://localhost:4200}

# --- Employee login (JWT access tokens, HS256) ---
# Signing key: base64, at least 32 bytes. Changing it logs everyone out.
app.jwt.secret=${JWT_SECRET:GHXMT8BsLjjibkBdX3G8oI/AaB5GIYtil+qp8XCyBD8IuVzeQTEWw/7Hz4vpIQpK}
# How long a login lasts (one working day)
app.jwt.validity=${JWT_VALIDITY:PT12H}
app.jwt.issuer=amsidel-backend
# Lock an account for a while after too many wrong PINs
app.login.max-failed-attempts=5
app.login.lock-duration=PT15M

# --- First start: created only when the tables are empty ---
# The owner must change this PIN at first login.
app.bootstrap.owner.user-id=${OWNER_USER_ID:owner}
app.bootstrap.owner.password=${OWNER_PASSWORD:Asd@2026}
app.bootstrap.owner.name=Amsidel Owner
# First brand of the group; more brands are added from the portal (owner only)
app.bootstrap.brand.code=DW
app.bootstrap.brand.name=Amsidel Doors & Windows

# --- Uploads: staff mail attachments up to 10 MB (MailFileStore); photos keep their own 2 MB limit
# (PhotoService, AttendancePhotoStore) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Leave ---
# Days not counted as leave (comma-separated, e.g. SATURDAY,SUNDAY)
app.leave.weekly-offs=SUNDAY
# "Today" for leave rules (cancel before start, default year)
app.leave.zone=Asia/Kolkata

# --- Staff mail (owners and admins send personal mail to employees' office addresses) ---
# Sent through Brevo (free plan: about 300 mails a day). The SMTP key (Brevo > SMTP & API > SMTP keys) is given as
# MAIL_PASSWORD and is not kept in the code; until it is set the portal shows mail as not set up.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
# 2525, not the usual 587: Render's free plan blocks outgoing mail ports 25, 465 and 587 (since Sep 2025).
# Brevo takes the same STARTTLS connection on 2525.
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:bf6436001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
# Sender shown to staff: must be a sender (or on a domain) verified in Brevo > Senders & Domains.
# Switch to an @amsidel.com address once that domain is verified (better for inboxes than a @gmail.com sender).
# team chat: messages older than this many days are cleared by the daily clean-up (7:00 in app.leave.zone)
app.chat.retention-days=${CHAT_RETENTION_DAYS:7}
app.chat.clean-cron=${CHAT_CLEAN_CRON:0 0 7 * * *}
app.razorpay.api=${RAZORPAY_API:https://api.razorpay.com/v1}
# the company's default Razorpay account, for brands without their own keys (set as environment variables / secrets.properties)
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.mail.from=${MAIL_FROM:info.amsidel@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Amsidel Group}
# Copied (CC) on every mail the portal sends: staff mail, customer and supplier mail, website enquiries and quote
# requests; empty = no copy
app.mail.always-cc=${MAIL_ALWAYS_CC:info.amsidel@gmail.com}

# --- Website enquiries (quote form, site-visit form, AMI chat): a designed mail to this inbox, through the same mail
# server; the website falls back to FormSubmit when it cannot be sent (see EnquiryService) ---
app.enquiry.to=${ENQUIRY_TO:info.amsidel@gmail.com}
app.enquiry.brand=Amsidel Doors & Windows

# --- Payslips (PDF and screen): the company shown at the top. Set the address before the first payslip goes out. ---
app.payslip.company-name=${PAYSLIP_COMPANY_NAME:Amsidel Enterprises Private Limited}
app.payslip.company-address=${PAYSLIP_COMPANY_ADDRESS:}

# --- Attendance (check-in / check-out) ---
# "Today" for the once-a-day check-in
app.attendance.zone=${app.leave.zone}
# Location worse than this (metres) is flagged LOW_ACCURACY
app.attendance.low-accuracy-metres=200
# Folder for check-in photos (attendance/{yyyy}/{MM}/{employeeId}/{dd}.jpg below it). Must be a disk that survives
# restarts and deploys (on Render: a persistent disk mounted here, e.g. ATTENDANCE_PHOTO_DIR=/var/data).
app.attendance.photo-dir=${ATTENDANCE_PHOTO_DIR:./data}
